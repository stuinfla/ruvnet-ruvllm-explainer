<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 504" width="360" height="504" role="img" aria-label="Passes per tool family out of 24 and arithmetic out of 64 for base, coding-4b and coding-4b-r2. coding-4b learned grep (0 to 24) and test (8 to 24) but broke write (21 to 8). coding-4b-r2 fixed write (24) and scored 192 of 192 on tools, but arithmetic fell from 62 to 46. Read, edit, glob, slice and injection stay at 24 in every run."><style>svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.g,.n{transform-box:fill-box}.g{transform-origin:left}@media (prefers-reduced-motion:no-preference){.g{animation:grow .9s ease var(--d) backwards}.n{animation:show .5s ease var(--d) backwards}}@keyframes grow{from{transform:scaleX(0)}}@keyframes show{from{opacity:0}}</style><rect width="360" height="504" rx="14" fill="#0d1117"/><text x="14" y="36" font-size="26" font-weight="800" fill="#f0f6fc" text-anchor="start">Fix one thing,</text><text x="14" y="66" font-size="26" font-weight="800" fill="#f0f6fc" text-anchor="start">break another</text><text x="14" y="92" font-size="13" font-weight="400" fill="#9aa4b2" text-anchor="start">Passes by tool family (of 24)</text><text x="14" y="109" font-size="13" font-weight="400" fill="#9aa4b2" text-anchor="start">and arithmetic (of 64), same tasks.</text><text x="84" y="136" font-size="13" font-weight="800" fill="#f0f6fc" text-anchor="start">base</text><text x="166" y="136" font-size="13" font-weight="800" fill="#f0f6fc" text-anchor="start">4b</text><text x="248" y="136" font-size="13" font-weight="800" fill="#f0f6fc" text-anchor="start">r2</text><text x="14" y="164.4" font-size="13" font-weight="700" fill="#f0f6fc" text-anchor="start">grep</text><rect x="84" y="150" width="28" height="20" rx="5" fill="#21262d"/><text class="n" style="--d:1.0s" x="116" y="164.8" font-size="12" font-weight="800" fill="#9aa4b2">0</text><rect x="166" y="150" width="28" height="20" rx="5" fill="#21262d"/><rect class="g" style="--d:1.4s" x="166" y="150" width="28.0" height="20" rx="5" fill="#3fb950"/><text class="n" style="--d:2.1s" x="198" y="164.8" font-size="12" font-weight="800" fill="#3fb950">24 ▲24</text><rect x="248" y="150" width="28" height="20" rx="5" fill="#21262d"/><rect class="g" style="--d:2.5s" x="248" y="150" width="28.0" height="20" rx="5" fill="#4a6a8a"/><text class="n" style="--d:3.2s" x="280" y="164.8" font-size="12" font-weight="800" fill="#9aa4b2">24</text><text x="14" y="204.4" font-size="13" font-weight="700" fill="#f0f6fc" text-anchor="start">test</text><rect x="84" y="190" width="28" height="20" rx="5" fill="#21262d"/><rect class="g" style="--d:0.3s" x="84" y="190" width="9.3" height="20" rx="5" fill="#4a6a8a"/><text class="n" style="--d:1.0s" x="116" y="204.8" font-size="12" font-weight="800" fill="#9aa4b2">8</text><rect x="166" y="190" width="28" height="20" rx="5" fill="#21262d"/><rect class="g" style="--d:1.4s" x="166" y="190" width="28.0" height="20" rx="5" fill="#3fb950"/><text class="n" style="--d:2.1s" x="198" y="204.8" font-size="12" font-weight="800" fill="#3fb950">24 ▲16</text><rect x="248" y="190" width="28" height="20" rx="5" fill="#21262d"/><rect class="g" style="--d:2.5s" x="248" y="190" width="28.0" height="20" rx="5" fill="#4a6a8a"/><text class="n" style="--d:3.2s" x="280" y="204.8" font-size="12" font-weight="800" fill="#9aa4b2">24</text><text x="14" y="244.4" font-size="13" font-weight="700" fill="#f0f6fc" text-anchor="start">write</text><rect x="84" y="230" width="28" height="20" rx="5" fill="#21262d"/><rect class="g" style="--d:0.3s" x="84" y="230" width="24.5" height="20" rx="5" fill="#4a6a8a"/><text class="n" style="--d:1.0s" x="116" y="244.8" font-size="12" font-weight="800" fill="#9aa4b2">21</text><rect x="166" y="230" width="28" height="20" rx="5" fill="#21262d"/><rect class="g" style="--d:1.4s" x="166" y="230" width="9.3" height="20" rx="5" fill="#f85149"/><text class="n" style="--d:2.1s" x="198" y="244.8" font-size="12" font-wei