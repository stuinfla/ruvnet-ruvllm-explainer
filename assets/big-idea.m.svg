28" height="20" rx="5" fill="#21262d"/><rect class="g" style="--d:2.5s" x="248" y="318" width="20.1" height="20" rx="5" fill="#f85149"/><text class="n" style="--d:3.2s" x="280" y="332.8" font-size="12" font-weight="800" fill="#f85149">46 ▼16</text><text x="14" y="376" font-size="12" font-weight="400" fill="#9aa4b2" text-anchor="start">*read, edit, glob, slice, injection</text><text x="14" y="408" font-size="17" font-weight="800" fill="#f0f6fc" text-anchor="start">Round 1 broke write.</text><text x="14" y="432" font-size="17" font-weight="800" fill="#f0f6fc" text-anchor="start">Round 2 fixed write,</text><text x="14" y="456" font-size="17" font-weight="800" fill="#f85149" text-anchor="start">and broke arithmetic.</text><text x="14" y="484" font-size="13" font-weight="400" fill="#9aa4b2" text-anchor="start">Only the per-task paired rule saw it.</text></svg>