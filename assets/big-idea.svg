<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 612" width="1100" height="612" role="img" aria-label="Passes per tool family out of 24 and arithmetic out of 64 for base, coding-4b and coding-4b-r2. coding-4b learned grep (0 to 24) and test (8 to 24) but broke write (21 to 8). coding-4b-r2 fixed write (24) and scored 192 of 192 on tools, but arithmetic fell from 62 to 46. Read, edit, glob, slice and injection stay at 24 in every run."><style>svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.g,.n{transform-box:fill-box}.g{transform-origin:left}@media (prefers-reduced-motion:no-preference){.g{animation:grow .9s ease var(--d) backwards}.n{animation:show .5s ease var(--d) backwards}}@keyframes grow{from{transform:scaleX(0)}}@keyframes show{from{opacity:0}}</style><rect width="1100" height="612" rx="14" fill="#0d1117"/><text x="40" y="54" font-size="36" font-weight="800" fill="#f0f6fc" text-anchor="start">Fix one thing, break another</text><text x="40" y="90" font-size="17" font-weight="400" fill="#9aa4b2" text-anchor="start">Passes per tool family (of 24) and for arithmetic (of 64). Same held-out tasks, three runs. Watch where the damage goes.</text><text x="330" y="146" font-size="20" font-weight="800" fill="#f0f6fc" text-anchor="start">base</text><text x="590" y="146" font-size="20" font-weight="800" fill="#f0f6fc" text-anchor="start">coding-4b</text><text x="850" y="146" font-size="20" font-weight="800" fill="#f0f6fc" text-anchor="start">coding-4b-r2</text><text x="40" y="191.04" font-size="21" font-weight="700" fill="#f0f6fc" text-anchor="start">grep</text><rect x="330" y="168" width="150" height="32" rx="5" fill="#21262d"/><text class="n" style="--d:1.0s" x="490" y="191.68" font-size="22" font-weight="800" fill="#9aa4b2">0</text><rect x="590" y="168" width="150" height="32" rx="5" fill="#21262d"/><rect class="g" style="--d:1.4s" x="590" y="168" width="150.0" height="32" rx="5" fill="#3fb950"/><text class="n" style="--d:2.1s" x="750" y="191.68" font-size="22" font-weight="800" fill="#3fb950">24 ▲24</text><rect x="850" y="168" width="150" height="32" rx="5" fill="#21262d"/><rect class="g" style="--d:2.5s" x="850" y="168" width="150.0" height="32" rx="5" fill="#4a6a8a"/><text class="n" style="--d:3.2s" x="1010" y="191.68" font-size="22" font-weight="800" fill="#9aa4b2">24</text><text x="40" y="257.04" font-size="21" font-weight="700" fill="#f0f6fc" text-anchor="start">test</text><rect x="330" y="234" width="150" height="32" rx="5" fill="#21262d"/><rect class="g" style="--d:0.3s" x="330" y="234" width="50.0" height="32" rx="5" fill="#4a6a8a"/><text class="n" style="--d:1.0s" x="490" y="257.68" font-size="22" font-weight="800" fill="#9aa4b2">8</text><rect x="590" y="234" width="150" height="32" rx="5" fill="#21262d"/><rect class="g" style="--d:1.4s" x="590" y="234" width="150.0" height="32" rx="5" fill="#3fb950"/><text class="n" style="--d:2.1s" x="750" y="257.68" font-size="22" font-weight="800" fill="#3fb950">24 ▲16</text><rect x="850" y="234" width="150" height="32" rx="5" fill="#21262d"/><rect class="g" style="--d:2.5s" x="850" y="234" width="150.0" height="32" rx="5" fill="#4a6a8a"/><text class="n" style="--d:3.2s" x="1010" y="257.68" font-size="22" font-weight="800" fill="#9aa4b2">24</text><text x="40" y="323.04" font-size="21" font-weight="700" fill="#f0f6fc" text-anchor="start">write</text><rect x="330" y="300" width="150" height="32" rx="5" fill="#21262d"/><rect class="g" style="--d:0.3s" x="330" y="300" width="131.3" height="32" rx="5" fill="#4a6a8a"/><text class="n" style="--d:1.0s" x="490" y="323.68" font-size="22" font-weight="800" fill="#9aa4b2">21</text><rect x="590" y="300" width="150" height="32" rx="5" fill="#21262d"/><rect class="g" style="--d:1.4s" x="590" y="300" width="50.0" height="32" rx="5" fill="#f85149"/><text class="n" style="--d:2.1s" x="750" y="323.68" font-size="22" font-weight="800" fill="#f85149">8 ▼13</text><rect x="850" y="300" width="150" height="3