<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" width="360" height="560" role="img" aria-label="coding-4b-r2 passed all 192 tool tasks, the best score of the three runs, and was rejected anyway: arithmetic fell from 62 to 46 of 64, breaking the rule sealed before any answer existed, that capability anchors must not regress."><style>svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.stamp{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.stamp{animation:slam .5s cubic-bezier(.2,1.6,.4,1) 1.6s backwards}}@keyframes slam{from{opacity:0;transform:scale(2.4)}}</style><rect width="360" height="560" rx="14" fill="#0d1117"/><text x="14" y="38" font-size="24" font-weight="800" fill="#f0f6fc" text-anchor="start">The best score of all</text><text x="14" y="66" font-size="24" font-weight="800" fill="#f0f6fc" text-anchor="start">was thrown out.</text><text x="14" y="168" font-size="78" font-weight="800" fill="#3fb950" text-anchor="start">192/192</text><text x="16" y="198" font-size="14" font-weight="500" fill="#9aa4b2" text-anchor="start">tool tasks passed. A perfect run.</text><g class="stamp"><g transform="translate(62,284) rotate(-8)"><rect x="-6" y="-44" width="230" height="62" rx="8" fill="none" stroke="#f85149" stroke-width="5"/><text x="109" y="2" font-size="44" font-weight="800" fill="#f85149" text-anchor="middle">REJECTED</text></g></g><text x="14" y="318" font-size="15" font-weight="500" fill="#9aa4b2" text-anchor="start">because arithmetic fell</text><text x="14" y="372" font-size="54" font-weight="800" fill="#f85149" text-anchor="start">62 → 46</text><text x="16" y="398" font-size="15" font-weight="500" fill="#9aa4b2" text-anchor="start">a quarter of it, gone</text><rect x="14" y="420" width="332" height="108" rx="12" fill="#161b22" stroke="#30363d"/><g transform="translate(30,436)"><rect x="0" y="10" width="24" height="19" rx="3" fill="#d29922"/><path d="M5 10V7a7 7 0 0 1 14 0v3" fill="none" stroke="#d29922" stroke-width="3.5"/></g><text x="66" y="454" font-size="13" font-weight="500" fill="#9aa4b2" text-anchor="start">Rule sealed before any answer,</text><text x="66" y="471" font-size="13" font-weight="500" fill="#9aa4b2" text-anchor="start">SHA-256 pinned:</text><text x="30" y="506" font-size="15" font-weight="800" fill="#f0f6fc" text-anchor="start">“capability anchors must not regress.”</text></svg>