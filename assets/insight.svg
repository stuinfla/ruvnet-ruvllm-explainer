<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" role="img" aria-label="coding-4b-r2 passed all 192 tool tasks, the best score of the three runs, and was rejected anyway: arithmetic fell from 62 to 46 of 64, breaking the rule sealed before any answer existed, that capability anchors must not regress."><style>svg text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.stamp{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.stamp{animation:slam .5s cubic-bezier(.2,1.6,.4,1) 1.6s backwards}}@keyframes slam{from{opacity:0;transform:scale(2.4)}}</style><rect width="1100" height="470" rx="14" fill="#0d1117"/><text x="40" y="54" font-size="36" font-weight="800" fill="#f0f6fc" text-anchor="start">The best score of all was thrown out.</text><g transform="translate(40,0)"><text x="0" y="222" font-size="150" font-weight="800" fill="#3fb950" text-anchor="start">192/192</text><text x="6" y="262" font-size="26" font-weight="500" fill="#9aa4b2" text-anchor="start">tool tasks passed. A perfect run.</text></g><g class="stamp"><g transform="translate(440,262) rotate(-9)"><rect x="-8" y="-62" width="300" height="86" rx="10" fill="none" stroke="#f85149" stroke-width="7"/><text x="142" y="2" font-size="62" font-weight="800" fill="#f85149" text-anchor="middle">REJECTED</text></g></g><text x="790" y="140" font-size="24" font-weight="500" fill="#9aa4b2" text-anchor="start">because arithmetic</text><text x="790" y="196" font-size="60" font-weight="800" fill="#f85149" text-anchor="start">62 → 46</text><text x="790" y="232" font-size="24" font-weight="500" fill="#9aa4b2" text-anchor="start">a quarter of it, gone</text><rect x="40" y="320" width="1020" height="100" rx="14" fill="#161b22" stroke="#30363d"/><g transform="translate(66,342)"><rect x="0" y="12" width="30" height="24" rx="4" fill="#d29922"/><path d="M6 12V8a9 9 0 0 1 18 0v4" fill="none" stroke="#d29922" stroke-width="4"/></g><text x="120" y="356" font-size="22" font-weight="500" fill="#9aa4b2" text-anchor="start">The rule was sealed before any answer existed, SHA-256 pinned:</text><text x="120" y="396" font-size="30" font-weight="800" fill="#f0f6fc" text-anchor="start">“capability anchors must not regress.”</text><text x="40" y="456" font-size="18" font-weight="400" fill="#9aa4b2" text-anchor="start">Call your shot before you take it, and the scoreboard cannot be talked into agreeing with you.</text></svg>